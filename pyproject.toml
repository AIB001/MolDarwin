# MolDarwin is a measuring instrument, so its own build is declared rather than implied.
# Before this file existed the package imported only through a sys.path insert in each
# test, which works until something imports moldarwin from anywhere else.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moldarwin"
version = "0.1.0"
description = "Evidence-governed active learning across composable CADD protocols"
license = "Apache-2.0"
requires-python = ">=3.11"
# Deliberately empty. MolDarwin's boundary layer shells out to GROMACS and reads MolCat
# and PRISM as vendored assets with their own environments; declaring those here would
# assert a single resolvable dependency set that does not exist. The asset manifest
# records what is actually pinned.
dependencies = []

[project.scripts]
# So `moldarwin plan` works once installed. The module entry point is the supported path either way:
# python -m moldarwin needs no install, which matters for a tool whose first job is to be argued with.
moldarwin = "moldarwin.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
mcp = ["mcp>=1.12,<2"]
llm = ["httpx>=0.27,<1"]
active = ["numpy>=1.24", "scipy>=1.10"]
design = ["jsonschema>=4.18"]
molecules = ["numpy>=1.26", "scipy>=1.10", "rdkit>=2024.9", "pydantic>=2.10,<3"]
cascade = [
    "numpy>=1.26", "scipy>=1.10", "rdkit>=2024.9", "pydantic>=2.10,<3",
    "pyarrow>=17,<26", "PyYAML>=6,<7", "openpyxl>=3.1,<4",
]
quarry = ["httpx>=0.27,<1", "pydantic>=2.10,<3"]
quarry-deliverables = [
    "httpx>=0.27,<1", "pydantic>=2.10,<3", "rdkit>=2025.3,<2027",
    "gemmi>=0.7,<0.8", "biopython>=1.85,<2", "numpy>=1.26,<3", "openpyxl>=3.1,<4",
]
# Combine with [cascade] for the actual MolCat feature and predictor pipeline.
# Kept optional: numerical active learning does not require ONNX export or inference.
bundles = ["scikit-learn>=1.3", "skl2onnx>=1.20,<2", "onnxruntime>=1.23,<2"]
# What the test suite actually needs, which was not the same as what it declared. `dependencies`
# above is empty on purpose and stays empty -- every third-party import in src/ is function-local, so
# the package imports on the standard library alone and the planning CLI runs with nothing installed.
# The tests are a different question and were answering it by accident: they need numpy, scikit-learn
# and RDKit outright, torch for the GPU featuriser's parity checks, and the vendored MolCat needs
# pydantic v2 -- an environment with v1 skipped a test that was reported as a pass count of 277.
# Declared here so "no GPU, no AmberTools, no network, no API key" describes a suite somebody else
# can actually make green.
test = [
    "pytest>=7",
    "httpx>=0.27,<1",
    "mcp>=1.12,<2",
    "numpy>=1.26",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "rdkit>=2024.9",
    "pydantic>=2.10,<3",
    "pyarrow>=17,<26",
    "PyYAML>=6,<7",
    "openpyxl>=3.1,<4",
    # Optional: the GPU featuriser's parity and binning tests skip without it, and the binning one
    # runs on CPU, so torch is worth having even on a machine with no CUDA device.
    "torch>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/moldarwin"]

[tool.hatch.build.targets.wheel.force-include]
# One document, two consumers: a Claude Code skill reads .claude/skills/<name>/SKILL.md and an MCP
# client reads moldarwin://skills/<slug>. Complete bundles are used by the current
# reader; the original six flat copies remain for older package consumers.
#
# Listed one by one rather than globbed, because the destination is the SLUG and the source is the
# DIRECTORY and the two differ: sweep <- moldarwin-screening-sweep, monitoring <- moldarwin-campaign-monitoring.
# A glob would ship moldarwin-screening-sweep/SKILL.md under a name nothing looks up.
#
# Tests resolve every registered bundle's actual source through these mappings,
# and compare complete source/wheel/install content, including pinned assets.
".claude/skills/moldarwin-campaign/SKILL.md" = "moldarwin/mcp/skills/campaign.md"
".claude/skills/moldarwin-screening-sweep/SKILL.md" = "moldarwin/mcp/skills/sweep.md"
".claude/skills/moldarwin-gate-calibration/SKILL.md" = "moldarwin/mcp/skills/gate-calibration.md"
".claude/skills/moldarwin-generation-planning/SKILL.md" = "moldarwin/mcp/skills/generation-planning.md"
".claude/skills/moldarwin-campaign-monitoring/SKILL.md" = "moldarwin/mcp/skills/monitoring.md"
".claude/skills/moldarwin-install/SKILL.md" = "moldarwin/mcp/skills/install.md"
# Complete bundles retain relative references for host exports and MCP reads.
# The flat entrypoint copies above remain available to older package consumers.
".claude/skills/moldarwin-campaign" = "moldarwin/mcp/skills/bundles/campaign"
".claude/skills/moldarwin-screening-sweep" = "moldarwin/mcp/skills/bundles/sweep"
".claude/skills/moldarwin-gate-calibration" = "moldarwin/mcp/skills/bundles/gate-calibration"
".claude/skills/moldarwin-generation-planning" = "moldarwin/mcp/skills/bundles/generation-planning"
".claude/skills/moldarwin-campaign-monitoring" = "moldarwin/mcp/skills/bundles/monitoring"
".claude/skills/moldarwin-install" = "moldarwin/mcp/skills/bundles/install"
".claude/skills/moldarwin-data-design" = "moldarwin/mcp/skills/bundles/data-design"
".claude/skills/moldarwin-research" = "moldarwin/mcp/skills/bundles/research"
".claude/skills/moldarwin-research-context" = "moldarwin/mcp/skills/bundles/research-context"
".claude/skills/moldarwin-research-decision" = "moldarwin/mcp/skills/bundles/research-decision"
".claude/skills/moldarwin-research-index" = "moldarwin/mcp/skills/bundles/research-index"
".claude/skills/moldarwin-method-configuration" = "moldarwin/mcp/skills/bundles/method-configuration"
".claude/skills/moldarwin-skill-improvement" = "moldarwin/mcp/skills/bundles/skill-improvement"
".claude/skills/moldarwin-execution-tuning" = "moldarwin/mcp/skills/bundles/execution-tuning"
".claude/skills/moldarwin-method-optimization" = "moldarwin/mcp/skills/bundles/method-optimization"
".claude/skills/moldarwin-workflow-optimization" = "moldarwin/mcp/skills/bundles/workflow-optimization"
".claude/skills/rsi-skill-creator" = "moldarwin/mcp/skills/bundles/rsi-skill-creator"
# Registration is derived from the bundles present (skills.discover_bundles), but a wheel
# can only ship files it was told to copy, so a bundle absent here is absent from the
# wheel and then absent from the catalog it would otherwise have joined. That is the same
# forgotten-list hazard, relocated -- and what closes it is that
# test_every_workflow_document_is_carried_into_the_wheel derives its expectation from the
# catalog, so a bundle added to .claude/skills and left out here fails the suite.
".claude/skills/moldarwin-assessment-regime" = "moldarwin/mcp/skills/bundles/assessment-regime"
".claude/skills/moldarwin-evaluation-contract" = "moldarwin/mcp/skills/bundles/evaluation-contract"
".claude/skills/moldarwin-recomputability-audit" = "moldarwin/mcp/skills/bundles/recomputability-audit"
".claude/skills/moldarwin-step-corpus" = "moldarwin/mcp/skills/bundles/step-corpus"
".claude/skills/moldarwin-stochastic-oracle" = "moldarwin/mcp/skills/bundles/stochastic-oracle"
# 2026-11-25. Two empirically grounded domain capabilities for gaps a review found: the method
# literature nobody had searched, and the target-specific parameters a new campaign had to guess.
".claude/skills/moldarwin-method-literature" = "moldarwin/mcp/skills/bundles/method-literature"
".claude/skills/moldarwin-target-parameters" = "moldarwin/mcp/skills/bundles/target-parameters"
# MolOrigin bundles stay at their original asset path in both source and wheel;
# skills.bundle_root and the legacy resource URIs resolve these same bytes.
"asset" = "moldarwin/_assets"

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
# So the tests import the package rather than a path they had to patch themselves.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# The width the code is already written at, declared rather than left to a default that
# disagrees with it. Picked from the existing sources, not imposed on them.
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
    # A band, a digest or a measured value belongs on one line even when it runs long;
    # E501 is checked in CI-by-eye rather than enforced, because wrapping a recorded
    # number is worse than reading a wide line.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests name their fixtures in the signature and pytest supplies them, and a test double
# implementing a protocol has to accept the arguments the protocol names whether it reads them
# or not -- a transport that ignores the prompt is the point of that double. ARG005 is the same
# case for a lambda: a stand-in for the ExpensiveStage protocol takes (allowed, cheap) because the
# protocol says so, and renaming them to underscores would hide which seam is being exercised.
"tests/*" = ["ARG001", "ARG002", "ARG005"]
